<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CWL Stats Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tema "HUD": grises fríos casi negros + azul técnico para el clan
      // principal + periwinkle/índigo para el secundario.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // ESCALA DE SUPERFICIES: la profundidad viene de escalones de
              // gris, no de bordes por todas partes.
              surface: {
                950: "#0a0a0b", // fondo de pagina
                900: "#0e0e10",
                850: "#141517",
                800: "#1a1b1e", // tarjetas
                700: "#232427", // elevado / hover
              },
              // BORDES hairline: uno normal y uno mas marcado.
              line: {
                DEFAULT: "#1e1f22",
                strong: "#2a2b2f",
              },
              // TEXTO en cuatro niveles.
              txt: {
                hi: "#f5f5f7",
                mid: "#d4d4d8",
                low: "#9a9ca1",
                dim: "#6e7075",
              },
              // ACENTO PRINCIPAL: solo para "esto requiere atencion".
              accent: {
                300: "#eb9470",
                400: "#e0754a",
                500: "#cf6236",
                600: "#b04f28",
                900: "#2a1710",
              },
              // REALCES SECUNDARIOS: en dosis pequenas (chips, iconos,
              // series de graficos). Nunca en superficies grandes ni en
              // botones primarios.
              amber: { 400: "#d9a441", 900: "#2a2110" },
              azure: { 400: "#5b9dd9", 900: "#101d2a" },
              lime: { 400: "#9db843", 900: "#1c2410" },
              // SEMANTICOS: exclusivamente bien / mal.
              ok: { 400: "#4a9d5f", 900: "#0f2416" },
              bad: { 400: "#c4554d", 900: "#2a1211" },

              // --- Alias de la paleta anterior, remapeados a la nueva.
              // Evita reescribir 17 componentes de golpe: todo adopta los
              // colores nuevos y los componentes se van migrando por fases.
              void: {
                950: "#0a0a0b", 900: "#0e0e10", 800: "#1a1b1e",
                700: "#232427", 600: "#2a2b2f", 500: "#3a3b40",
              },
              ink: {
                50: "#f5f5f7", 200: "#d4d4d8", 400: "#9a9ca1",
                500: "#6e7075", 600: "#55565b",
              },
              signal: {
                200: "#f0c4ae", 300: "#eb9470", 400: "#e0754a",
                500: "#cf6236", 600: "#b04f28", 700: "#8a3d1f", 900: "#2a1710",
              },
              steel: {
                200: "#c9cdd4", 300: "#a4aab4", 400: "#7f8794",
                500: "#646c79", 600: "#4d5460", 700: "#3a404a",
              },
            },
            fontFamily: {
              sans: ['"Inter"', "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
