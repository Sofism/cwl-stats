<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CWL Stats Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tema "War Room Ledger": grafito cálido + acento señal (teal) para el
      // clan principal + acento acero (azul grisáceo) para el secundario.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              void: {
                950: "#0e0f12",
                900: "#15171b",
                800: "#1c1f25",
                700: "#262a31",
                600: "#333941",
                500: "#454c56",
              },
              ink: {
                50: "#f2f0e9",
                200: "#d6d3c9",
                400: "#9a9890",
                500: "#7d7b74",
                600: "#5f5d58",
              },
              signal: {
                200: "#b7e4ea",
                300: "#8ad2db",
                400: "#55b9c6",
                500: "#3a9aa8",
                600: "#2c7d8a",
                700: "#22626c",
                900: "#122b30",
              },
              steel: {
                200: "#cdd6e0",
                300: "#a7b6c8",
                400: "#7891aa",
                500: "#5c7591",
                600: "#495d74",
                700: "#37475a",
              },
            },
            fontFamily: {
              display: ['"Barlow Condensed"', "sans-serif"],
              sans: ['"Inter"', "sans-serif"],
              mono: ['"IBM Plex Mono"', "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
