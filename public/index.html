<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CWL Stats Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tema "HUD": grises fríos casi negros + azul técnico para el clan
      // principal + periwinkle/índigo para el secundario.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              void: {
                950: "#080b12",
                900: "#0d111a",
                800: "#141a25",
                700: "#1e2634",
                600: "#2b3547",
                500: "#3d4a61",
              },
              ink: {
                50: "#eef2f8",
                200: "#cbd5e6",
                400: "#8b97ad",
                500: "#6f7b91",
                600: "#556073",
              },
              signal: {
                200: "#bcdcff",
                300: "#7dbcff",
                400: "#3d99ff",
                500: "#1a7fff",
                600: "#0d63d6",
                700: "#0b4ea8",
                900: "#0a2547",
              },
              steel: {
                200: "#d3d5f7",
                300: "#aab0ef",
                400: "#7b83e0",
                500: "#5f68cf",
                600: "#4a51a8",
                700: "#383e80",
              },
            },
            fontFamily: {
              sans: ['"Inter"', "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
