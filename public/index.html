<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CWL Stats Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tema "HUD": grises fríos casi negros + azul técnico para el clan
      // principal + periwinkle/índigo para el secundario.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // ESCALA DE SUPERFICIES: la profundidad viene de escalones de
              // gris, no de bordes por todas partes.
              surface: {
                950: "#0a0a0b", // fondo de pagina
                900: "#0e0e10",
                850: "#141517",
                800: "#1a1b1e", // tarjetas
                700: "#232427", // elevado / hover
              },
              // BORDES hairline: uno normal y uno mas marcado.
              line: {
                DEFAULT: "#1e1f22",
                strong: "#2a2b2f",
              },
              // TEXTO en cuatro niveles.
              txt: {
                hi: "#f5f5f7",
                mid: "#d4d4d8",
                low: "#9a9ca1",
                dim: "#6e7075",
              },
              // ACENTO PRINCIPAL: solo para "esto requiere atencion".
              // Definido con variables CSS para poder cambiarlo desde
              // Ajustes sin recompilar. Ver setAccent() mas abajo.
              accent: {
                300: "rgb(var(--accent-300) / <alpha-value>)",
                400: "rgb(var(--accent-400) / <alpha-value>)",
                500: "rgb(var(--accent-500) / <alpha-value>)",
                600: "rgb(var(--accent-600) / <alpha-value>)",
                900: "rgb(var(--accent-900) / <alpha-value>)",
              },
              // REALCES SECUNDARIOS: en dosis pequenas (chips, iconos,
              // series de graficos). Nunca en superficies grandes ni en
              // botones primarios.
              amber: { 400: "#d9a441", 900: "#2a2110" },
              rust: { 400: "#e0754a", 900: "#2a1710" },
              azure: { 400: "#5b9dd9", 900: "#101d2a" },
              lime: { 400: "#9db843", 900: "#1c2410" },
              // SEMANTICOS: exclusivamente bien / mal.
              ok: { 400: "#4a9d5f", 900: "#0f2416" },
              bad: { 400: "#c4554d", 900: "#2a1211" },

              // --- Alias de la paleta anterior, remapeados a la nueva.
              // Evita reescribir 17 componentes de golpe: todo adopta los
              // colores nuevos y los componentes se van migrando por fases.
              void: {
                950: "#0a0a0b", 900: "#0e0e10", 800: "#1a1b1e",
                700: "#232427", 600: "#2a2b2f", 500: "#3a3b40",
              },
              ink: {
                50: "#f5f5f7", 200: "#d4d4d8", 400: "#9a9ca1",
                500: "#6e7075", 600: "#55565b",
              },
              signal: {
                200: "rgb(var(--accent-300) / <alpha-value>)",
                300: "rgb(var(--accent-300) / <alpha-value>)",
                400: "rgb(var(--accent-400) / <alpha-value>)",
                500: "rgb(var(--accent-500) / <alpha-value>)",
                600: "rgb(var(--accent-600) / <alpha-value>)",
                700: "rgb(var(--accent-600) / <alpha-value>)",
                900: "rgb(var(--accent-900) / <alpha-value>)",
              },
              steel: {
                200: "#c9cdd4", 300: "#a4aab4", 400: "#7f8794",
                500: "#646c79", 600: "#4d5460", 700: "#3a404a",
              },
            },
            fontFamily: {
              sans: ['"Inter"', "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
          },
        },
      };
    </script>
    <script>
      // Paletas de acento disponibles (valores RGB sin coma, formato que
      // espera rgb(var(--x) / alpha) de Tailwind).
      window.ACCENTS = {
        lime:  { 300: "195 221 116", 400: "168 199 78",  500: "142 169 58",  600: "113 136 44", 900: "27 36 16" },
        azure: { 300: "141 191 235", 400: "91 157 217",  500: "70 130 188",  600: "52 103 152", 900: "16 29 42" },
        amber: { 300: "232 194 120", 400: "217 164 65",  500: "184 135 45",  600: "148 106 32", 900: "42 33 16" },
        rust:  { 300: "235 148 112", 400: "224 117 74",  500: "207 98 54",   600: "176 79 40",  900: "42 23 16" },
        violet:{ 300: "184 168 236", 400: "146 125 214", 500: "121 100 190", 600: "95 78 152",  900: "26 22 42" },
      };
      window.setAccent = function (name) {
        var a = window.ACCENTS[name] || window.ACCENTS.lime;
        Object.keys(a).forEach(function (k) {
          document.documentElement.style.setProperty("--accent-" + k, a[k]);
        });
        try { localStorage.setItem("cwl-accent", name); } catch (e) {}
      };
      // Se aplica antes de pintar para evitar un parpadeo de color.
      (function () {
        var saved = "lime";
        try { saved = localStorage.getItem("cwl-accent") || "lime"; } catch (e) {}
        window.setAccent(saved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
